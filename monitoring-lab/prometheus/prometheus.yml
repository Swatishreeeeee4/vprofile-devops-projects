global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: node            # host CPU / memory / disk / network
    static_configs: [{ targets: ["node-exporter:9100"], labels: { instance: web01 } }]
  - job_name: titan           # the app's own /metrics (requests, latency)
    static_configs: [{ targets: ["titan:5000"], labels: { instance: titan-app } }]
