groups:
  - name: vprofile-monitoring
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.instance }} is down"
      - alert: HighRequestLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[2m]))) > 0.45
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "p95 latency is {{ $value | humanize }}s (> 0.45s)"
      - alert: HighCPU
        expr: 100 - avg(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100 > 80
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "CPU usage {{ $value | humanize }}%"
