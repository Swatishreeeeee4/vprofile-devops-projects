# Baseline applied to every server, on both OS families.
- name: Install base packages (Debian family)
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install base packages (RedHat family)
  ansible.builtin.dnf:
    name: "{{ base_packages }}"
    state: present
  when: ansible_os_family == "RedHat"

- name: Admin group
  ansible.builtin.group:
    name: "{{ admin_group }}"
    state: present

- name: Admin users (loop)
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ admin_group }}"
    append: true
    shell: /bin/bash
  loop: "{{ admin_users }}"

- name: Sudo for the admin group (file is checked with visudo before it is installed)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/{{ admin_group }}
    content: "%{{ admin_group }} ALL=(ALL) ALL\n"
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Login banner with facts about this host
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    mode: "0644"

- name: SSH hardening drop-in
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0600"
  notify: Reload sshd

- name: Check the full sshd configuration is valid
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
