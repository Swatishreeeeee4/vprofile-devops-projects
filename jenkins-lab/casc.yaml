# Jenkins Configuration as Code: no clicking in the UI. Secrets come from environment variables.
jenkins:
  systemMessage: "VProfile CI lab (configured as code)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              id: sonar-token
              secret: ${SONAR_TOKEN}
              description: SonarQube analysis token
          - usernamePassword:
              id: nexuslogin
              username: admin
              password: ${NEXUS_PASSWORD}
              description: Nexus admin
unclassified:
  location:
    url: http://localhost:8080/
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: sonarserver
        serverUrl: http://sonarqube:9000
        credentialsId: sonar-token
tool:
  sonarRunnerInstallation:
    installations:
      - name: sonarscanner
        properties:
          - installSource:
              installers:
                - sonarRunnerInstaller:
                    id: "6.2.1.4610"
jobs:
  - script: |
      pipelineJob('vprofile-ci') {
        description('Build, test, Checkstyle, SonarQube + Quality Gate, publish WAR to Nexus')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/Swatishreeeeee4/vprofile-devops-projects.git') }
                branch('*/jenkins-ci')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
        properties {
          pipelineTriggers { triggers { pollSCM { scmpoll_spec('H/2 * * * *') } } }
        }
      }
