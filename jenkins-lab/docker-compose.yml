services:
  jenkins:
    build: .
    container_name: jenkins
    ports: ["8080:8080"]
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      SONAR_TOKEN: ${SONAR_TOKEN}
      NEXUS_PASSWORD: ${NEXUS_PASSWORD}
    volumes: [jenkins_home:/var/jenkins_home]
    mem_limit: 2g

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports: ["9000:9000"]
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"   # lab: skip the vm.max_map_count host check
    volumes: [sonar_data:/opt/sonarqube/data]
    mem_limit: 3g

  nexus:
    image: sonatype/nexus3:3.75.1
    container_name: nexus
    ports: ["8081:8081"]
    volumes: [nexus_data:/nexus-data]
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Xms512m -Xmx1g -XX:MaxDirectMemorySize=1g"
    mem_limit: 2500m

volumes:
  jenkins_home: {}
  sonar_data: {}
  nexus_data: {}
